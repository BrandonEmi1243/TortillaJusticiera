<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: rgb(46, 46, 46);
    }

    p {
      font-family: "Comic Sans MS", "Roboto", "Arial", "Helvetica";
      font-size: 100px;
      color: #fff;
      text-align: center;
      transform: translate(-50%, -50%);
      position: absolute;
      top: 50%;
      left: 50%;
    }

    div {
      color: #fff;
      font-size: 30px;
      font-family: "Comic Sans MS";
      text-align: center;
      margin-top: 170px;
      transform: translate(-50%, -50%);
      position: absolute;
      top: 50%;
      left: 50%;
    }
  </style>
</head>

<body>
  <section>
    <div id="current_date">
      <script>
        function something() {
        date = new Date();
          year = date.getFullYear();
          month = date.getMonth() + 1;
          day = date.getDate();
          document.getElementById("current_date").innerHTML =   month + "/" + day + "/" + year;
        }
        setInterval(something, 1000);
      </script>
    </div>


    <p id="display-time">
      <script>
        function myFunc()  {
          var now = new Date();
          var time = now.getHours() + ":" + now.getMinutes() + ":" + now.getSeconds();
          document.getElementById('display-time').innerHTML = time;
        }
    setInterval(myFunc, 1000);
      </script>
    </p>
  </section>
</body>

</html>
